name: DCO

# Every commit of a pull request carries a Signed-off-by trailer (CONTRIBUTING.md, "Developer Certificate of Origin").
on: pull_request

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -q .; then
              echo "::error::commit $(git show -s --format='%h %s' "$c") has no Signed-off-by (use git commit -s)"
              missing=1
            fi
          done
          exit "$missing"
